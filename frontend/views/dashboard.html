<!-- View: Admin dashboard (#dashboard). Will be restricted to admin users once auth exists. -->
<div class="container py-5">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div>
      <p class="eyebrow mb-1">Administration</p>
      <h1 class="mb-0">Dashboard</h1>
    </div>
    <button class="btn btn-gold" data-bs-toggle="modal" data-bs-target="#productModal"><i class="bi bi-plus-lg me-1"></i> New product</button>
  </div>

  <div class="row g-4 mb-5">
    <div class="col-6 col-lg-3"><div class="card card-body stat-card"><span class="eyebrow">Revenue (month)</span><span class="value">€48,920</span></div></div>
    <div class="col-6 col-lg-3"><div class="card card-body stat-card"><span class="eyebrow">Orders</span><span class="value">126</span></div></div>
    <div class="col-6 col-lg-3"><div class="card card-body stat-card"><span class="eyebrow">Customers</span><span class="value">1,204</span></div></div>
    <div class="col-6 col-lg-3"><div class="card card-body stat-card"><span class="eyebrow">Low stock</span><span class="value">7</span></div></div>
  </div>

  <ul class="nav nav-pills dash-nav mb-3" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#dash-orders" type="button" role="tab">Orders</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#dash-products" type="button" role="tab">Products</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#dash-categories" type="button" role="tab">Categories</button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="dash-orders" role="tabpanel">
      <div class="card table-responsive">
        <table class="table align-middle mb-0">
          <thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th></tr></thead>
          <tbody id="dashOrders"></tbody>
        </table>
      </div>
    </div>

    <div class="tab-pane fade" id="dash-products" role="tabpanel">
      <div class="card table-responsive">
        <table class="table align-middle mb-0">
          <thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th class="text-end">Actions</th></tr></thead>
          <tbody id="dashProducts"></tbody>
        </table>
      </div>
    </div>

    <div class="tab-pane fade" id="dash-categories" role="tabpanel">
      <div class="card card-body">
        <ul class="list-group list-group-flush">
          <li class="list-group-item bg-transparent d-flex justify-content-between">Women <span class="text-muted small">3 products</span></li>
          <li class="list-group-item bg-transparent d-flex justify-content-between">Men <span class="text-muted small">3 products</span></li>
          <li class="list-group-item bg-transparent d-flex justify-content-between">Accessories <span class="text-muted small">2 products</span></li>
        </ul>
      </div>
    </div>
  </div>
</div>

<!-- Create / edit product modal -->
<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <form class="modal-content rounded-0" novalidate data-success="Product saved (demo).">
      <div class="modal-header">
        <h5 class="modal-title" id="productModalLabel">Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-8"><label class="form-label" for="pmName">Name</label><input id="pmName" class="form-control" required></div>
          <div class="col-md-4"><label class="form-label" for="pmPrice">Price (€)</label><input type="number" min="0" id="pmPrice" class="form-control" required></div>
          <div class="col-md-6">
            <label class="form-label" for="pmCategory">Category</label>
            <select id="pmCategory" class="form-select" required><option value="">Choose…</option><option>Women</option><option>Men</option><option>Accessories</option></select>
          </div>
          <div class="col-md-6"><label class="form-label" for="pmSizes">Sizes (comma separated)</label><input id="pmSizes" class="form-control" placeholder="S, M, L"></div>
          <div class="col-12"><label class="form-label" for="pmDesc">Description</label><textarea id="pmDesc" class="form-control" rows="3"></textarea></div>
          <div class="col-12"><label class="form-label" for="pmImage">Image</label><input type="file" id="pmImage" class="form-control" accept="image/*"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-dark">Save product</button>
      </div>
    </form>
  </div>
</div>
