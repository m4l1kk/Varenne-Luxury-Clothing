<!-- View: Login (#login) -->
<div class="container py-5">
  <div class="auth-wrap py-4">
    <div class="text-center mb-4">
      <p class="eyebrow">Welcome back</p>
      <h1>Sign in</h1>
    </div>

    <form class="card card-body p-4" novalidate data-success="Signed in (demo). Authentication arrives in Milestone 2.">
      <div class="mb-3">
        <label class="form-label" for="loginEmail">Email</label>
        <input type="email" id="loginEmail" class="form-control" required>
        <div class="invalid-feedback">Please enter a valid email.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="form-control" minlength="8" required>
        <div class="invalid-feedback">Password must have at least 8 characters.</div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="loginRemember">
          <label class="form-check-label small" for="loginRemember">Remember me</label>
        </div>
        <a href="#login" class="small js-demo-action">Forgot password?</a>
      </div>
      <button class="btn btn-dark w-100">Sign in</button>
    </form>

    <div class="divider my-4">New to Varenne</div>
    <a href="#register" class="btn btn-outline-dark w-100">Create an account</a>
  </div>
</div>
