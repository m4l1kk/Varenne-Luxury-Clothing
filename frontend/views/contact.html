<!-- View: Contact / client care (#contact) -->
<div class="view-header">
  <p class="eyebrow">Client care</p>
  <h1>Contact us</h1>
</div>

<div class="container">
  <div class="row g-5">
    <div class="col-lg-7">
      <form class="card card-body p-4" novalidate data-success="Message sent (demo). Our client advisors will reply soon.">
        <div class="row g-3">
          <div class="col-sm-6"><label class="form-label" for="ctName">Name</label><input id="ctName" class="form-control" required></div>
          <div class="col-sm-6"><label class="form-label" for="ctEmail">Email</label><input type="email" id="ctEmail" class="form-control" required></div>
          <div class="col-12">
            <label class="form-label" for="ctTopic">Topic</label>
            <select id="ctTopic" class="form-select"><option>Order enquiry</option><option>Returns</option><option>Private appointment</option><option>Other</option></select>
          </div>
          <div class="col-12"><label class="form-label" for="ctMsg">Message</label><textarea id="ctMsg" class="form-control" rows="5" required></textarea></div>
        </div>
        <button class="btn btn-dark mt-4 align-self-start">Send message</button>
      </form>
    </div>

    <div class="col-lg-5">
      <h4 class="mb-3">Flagship boutique</h4>
      <p class="text-muted mb-1"><i class="bi bi-geo-alt me-2 text-gold"></i>Ferhadija 1, 71000 Sarajevo</p>
      <p class="text-muted mb-1"><i class="bi bi-telephone me-2 text-gold"></i>+387 33 000 000</p>
      <p class="text-muted mb-4"><i class="bi bi-envelope me-2 text-gold"></i>care@varenne.example</p>
      <h4 class="mb-3">Opening hours</h4>
      <p class="text-muted small mb-0">Monday to Saturday, 10:00 to 20:00<br>Sunday by appointment</p>
    </div>
  </div>
</div>
